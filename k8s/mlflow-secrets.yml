---
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-postgres-secret
  namespace: mlops
type: Opaque
data:
  password: bWxmbG93LXBhc3N3ZA==  # mlflow-passwd (base64 encoded)

---
# MinIO Secret
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-minio-secret
  namespace: mlops
type: Opaque
data:
  password: bWxmbG93LW1pbmlvLXBhc3N3ZA==  # mlflow-minio-passw (base64 encoded)

---
# MLflow Server Service
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: mlflow-server
  ports:
  - port: 5000
    targetPort: 5000
    name: http
