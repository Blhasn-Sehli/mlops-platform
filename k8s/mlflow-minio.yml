---
# MinIO Service
apiVersion: v1
kind: Service
metadata:
  name: mlflow-minio
  namespace: mlops
spec:
  type: ClusterIP
  selector:
    app: mlflow-minio
  ports:
  - port: 9000
    targetPort: 9000
    name: api
  - port: 9001
    targetPort: 9001
    name: console

---
# MinIO Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-minio
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-minio
  template:
    metadata:
      labels:
        app: mlflow-minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        env:
        - name: MINIO_ROOT_USER
          value: mlflow
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mlflow-minio-secret
              key: password
        - name: MINIO_BROWSER
          value: "on"
        command:
        - minio
        - server
        - /minio-data
        - --console-address
        - ":9001"
        volumeMounts:
        - name: minio-storage
          mountPath: /minio-data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: minio-storage
        persistentVolumeClaim:
          claimName: mlflow-minio-pvc
