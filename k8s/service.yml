apiVersion: v1
kind: Service
metadata:
  name: mlops-api-service
  namespace: mlops
  labels:
    app: mlops-api
spec:
  selector:
    app: mlops-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP

---
# PersistentVolumeClaim for the SQLite prediction log
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: predictions-pvc
  namespace: mlops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
