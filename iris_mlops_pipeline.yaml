# PIPELINE DEFINITION
# Name: iris-mlops-pipeline
# Description: End-to-end MLOps pipeline: load -> train -> evaluate -> register
# Inputs:
#    accuracy_threshold: float [Default: 0.9]
#    max_depth: int [Default: 5.0]
#    mlflow_tracking_uri: str [Default: 'http://mlflow:5000']
#    n_estimators: int [Default: 100.0]
components:
  comp-condition-1:
    dag:
      tasks:
        register-model:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-register-model
          inputs:
            artifacts:
              input_model:
                componentInputArtifact: pipelinechannel--train-model-output_model
            parameters:
              mlflow_tracking_uri:
                componentInputParameter: pipelinechannel--mlflow_tracking_uri
          taskInfo:
            name: register-model
    inputDefinitions:
      artifacts:
        pipelinechannel--train-model-output_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--evaluate-model-approved:
          parameterType: BOOLEAN
        pipelinechannel--mlflow_tracking_uri:
          parameterType: STRING
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        input_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        input_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        accuracy_threshold:
          defaultValue: 0.9
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        approved:
          parameterType: BOOLEAN
  comp-load-data:
    executorLabel: exec-load-data
    outputDefinitions:
      artifacts:
        output_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        output_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-register-model:
    executorLabel: exec-register-model
    inputDefinitions:
      artifacts:
        input_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        mlflow_tracking_uri:
          parameterType: STRING
        model_name:
          defaultValue: iris-random-forest
          isOptional: true
          parameterType: STRING
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        input_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        max_depth:
          defaultValue: 5.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        n_estimators:
          defaultValue: 100.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        output_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.4.2'\
          \ 'pandas==2.1.4' 'numpy==1.26.4' 'joblib==1.3.2'  &&  python3 -m pip install\
          \ --quiet --no-warn-script-location 'kfp==2.16.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model(\n    input_model: Input[Model],\n    input_test:\
          \ Input[Dataset],\n    metrics: Output[Metrics],\n    accuracy_threshold:\
          \ float = 0.90,\n) -> NamedTuple(\"Outputs\", [(\"approved\", bool)]):\n\
          \    \"\"\"Evaluate model on test set; returns True if above threshold.\"\
          \"\"\n    from collections import namedtuple\n\n    import joblib\n    import\
          \ pandas as pd\n    from sklearn.metrics import accuracy_score, f1_score\n\
          \n    model = joblib.load(input_model.path)\n\n    test_df = pd.read_csv(input_test.path)\n\
          \    X_test = test_df.drop(\"target\", axis=1)\n    y_test = test_df[\"\
          target\"]\n\n    preds = model.predict(X_test)\n    accuracy = accuracy_score(y_test,\
          \ preds)\n    f1 = f1_score(y_test, preds, average=\"weighted\")\n\n   \
          \ metrics.log_metric(\"accuracy\", round(accuracy, 4))\n    metrics.log_metric(\"\
          f1_score\", round(f1, 4))\n    metrics.log_metric(\"threshold\", accuracy_threshold)\n\
          \    metrics.log_metric(\"promoted\", int(accuracy >= accuracy_threshold))\n\
          \n    print(f\"Accuracy : {accuracy:.4f}\")\n    print(f\"F1 Score : {f1:.4f}\"\
          )\n    print(f\"Promoted : {accuracy >= accuracy_threshold}\")\n\n    return\
          \ namedtuple(\"Outputs\", [\"approved\"])(accuracy >= accuracy_threshold)\n\
          \n"
        image: python:3.11-slim
    exec-load-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - load_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.4.2'\
          \ 'pandas==2.1.4' 'numpy==1.26.4' 'joblib==1.3.2'  &&  python3 -m pip install\
          \ --quiet --no-warn-script-location 'kfp==2.16.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef load_data(output_train: Output[Dataset], output_test: Output[Dataset]):\n\
          \    \"\"\"Load Iris dataset and persist train/test splits as CSV.\"\"\"\
          \n    import pandas as pd\n    from sklearn.datasets import load_iris\n\
          \    from sklearn.model_selection import train_test_split\n\n    iris =\
          \ load_iris()\n    feature_names = [\"sepal_length\", \"sepal_width\", \"\
          petal_length\", \"petal_width\"]\n\n    df = pd.DataFrame(iris.data, columns=feature_names)\n\
          \    df[\"target\"] = iris.target\n\n    X_train, X_test, y_train, y_test\
          \ = train_test_split(\n        df[feature_names], df[\"target\"], test_size=0.2,\
          \ random_state=42\n    )\n\n    train_df = X_train.copy()\n    train_df[\"\
          target\"] = y_train.values\n    test_df = X_test.copy()\n    test_df[\"\
          target\"] = y_test.values\n\n    train_df.to_csv(output_train.path, index=False)\n\
          \    test_df.to_csv(output_test.path, index=False)\n\n    print(f\"Train\
          \ samples : {len(train_df)}\")\n    print(f\"Test  samples : {len(test_df)}\"\
          )\n\n"
        image: python:3.11-slim
    exec-register-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.4.2'\
          \ 'pandas==2.1.4' 'numpy==1.26.4' 'joblib==1.3.2' 'mlflow==2.13.0'  && \
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_model(\n    input_model: Input[Model],\n    mlflow_tracking_uri:\
          \ str,\n    model_name: str = \"iris-random-forest\",\n):\n    \"\"\"Register\
          \ the model in MLFlow Model Registry and assign 'champion' alias.\"\"\"\n\
          \    import joblib\n    import mlflow.sklearn\n\n    import mlflow\n   \
          \ from mlflow import MlflowClient\n\n    mlflow.set_tracking_uri(mlflow_tracking_uri)\n\
          \    mlflow.set_experiment(\"iris-classification-kubeflow\")\n\n    model\
          \ = joblib.load(input_model.path)\n\n    with mlflow.start_run() as run:\n\
          \        mlflow.set_tag(\"pipeline\", \"kubeflow\")\n        mlflow.sklearn.log_model(\n\
          \            sk_model=model,\n            artifact_path=\"model\",\n   \
          \         registered_model_name=model_name,\n        )\n        run_id =\
          \ run.info.run_id\n\n    client = MlflowClient()\n    versions = client.search_model_versions(f\"\
          name='{model_name}' and run_id='{run_id}'\")\n    if versions:\n       \
          \ version = versions[0].version\n        client.set_registered_model_alias(model_name,\
          \ \"champion\", version)\n        print(f\"\u2705 Model v{version} promoted\
          \ to alias 'champion'\")\n    else:\n        print(\"\u26A0\uFE0F  Could\
          \ not find registered version\")\n\n"
        image: python:3.11-slim
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.4.2'\
          \ 'pandas==2.1.4' 'numpy==1.26.4' 'joblib==1.3.2'  &&  python3 -m pip install\
          \ --quiet --no-warn-script-location 'kfp==2.16.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(\n    input_train: Input[Dataset],\n    output_model:\
          \ Output[Model],\n    n_estimators: int = 100,\n    max_depth: int = 5,\n\
          ):\n    \"\"\"Train RandomForest with grid search and save best model.\"\
          \"\"\n    import joblib\n    import pandas as pd\n    from sklearn.ensemble\
          \ import RandomForestClassifier\n    from sklearn.model_selection import\
          \ GridSearchCV\n\n    train_df = pd.read_csv(input_train.path)\n    X_train\
          \ = train_df.drop(\"target\", axis=1)\n    y_train = train_df[\"target\"\
          ]\n\n    param_grid = {\n        \"n_estimators\": [50, n_estimators, n_estimators\
          \ * 2],\n        \"max_depth\": [3, max_depth, max_depth * 2],\n    }\n\
          \    grid = GridSearchCV(\n        RandomForestClassifier(random_state=42),\n\
          \        param_grid,\n        cv=5,\n        scoring=\"accuracy\",\n   \
          \     n_jobs=-1,\n    )\n    grid.fit(X_train, y_train)\n\n    joblib.dump(grid.best_estimator_,\
          \ output_model.path)\n\n    print(f\"Best params : {grid.best_params_}\"\
          )\n    print(f\"Best CV acc : {grid.best_score_:.4f}\")\n\n    output_model.metadata[\"\
          best_params\"] = str(grid.best_params_)\n    output_model.metadata[\"cv_accuracy\"\
          ] = str(round(grid.best_score_, 4))\n\n"
        image: python:3.11-slim
pipelineInfo:
  description: 'End-to-end MLOps pipeline: load -> train -> evaluate -> register'
  name: iris-mlops-pipeline
root:
  dag:
    tasks:
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - evaluate-model
        - train-model
        inputs:
          artifacts:
            pipelinechannel--train-model-output_model:
              taskOutputArtifact:
                outputArtifactKey: output_model
                producerTask: train-model
          parameters:
            pipelinechannel--evaluate-model-approved:
              taskOutputParameter:
                outputParameterKey: approved
                producerTask: evaluate-model
            pipelinechannel--mlflow_tracking_uri:
              componentInputParameter: mlflow_tracking_uri
        taskInfo:
          name: condition-1
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--evaluate-model-approved']
            == true
      evaluate-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - load-data
        - train-model
        inputs:
          artifacts:
            input_model:
              taskOutputArtifact:
                outputArtifactKey: output_model
                producerTask: train-model
            input_test:
              taskOutputArtifact:
                outputArtifactKey: output_test
                producerTask: load-data
          parameters:
            accuracy_threshold:
              componentInputParameter: accuracy_threshold
        taskInfo:
          name: evaluate-model
      load-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-load-data
        taskInfo:
          name: load-data
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        dependentTasks:
        - load-data
        inputs:
          artifacts:
            input_train:
              taskOutputArtifact:
                outputArtifactKey: output_train
                producerTask: load-data
          parameters:
            max_depth:
              componentInputParameter: max_depth
            n_estimators:
              componentInputParameter: n_estimators
        taskInfo:
          name: train-model
  inputDefinitions:
    parameters:
      accuracy_threshold:
        defaultValue: 0.9
        isOptional: true
        parameterType: NUMBER_DOUBLE
      max_depth:
        defaultValue: 5.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      mlflow_tracking_uri:
        defaultValue: http://mlflow:5000
        isOptional: true
        parameterType: STRING
      n_estimators:
        defaultValue: 100.0
        isOptional: true
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.0
