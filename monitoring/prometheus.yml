global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ── Alertmanager ─────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# ── Alerting rules ───────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/alert.rules.yml

# ── Scrape targets ───────────────────────────────────────────────────────────
scrape_configs:
  - job_name: "mlops-api"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    # This expects: kubectl port-forward -n mlops svc/mlops-api-service 8000:80

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
