groups:
  - name: mlops-api
    rules:

      # ── Disponibilité ────────────────────────────────────────────────────
      - alert: APIDown
        expr: absent(http_requests_total)
        for: 5m
        labels:
          severity: critical
          team: mlops
        annotations:
          summary: "MLOps API is unreachable"
          description: >
            No metrics have been received from the API for more than 5 minutes.
            The service may be down or Prometheus cannot reach it.

      # ── Taux d'erreurs ───────────────────────────────────────────────────
      - alert: HighErrorRate
        expr: >
          sum(rate(http_requests_total{status_code=~"5.."}[2m]))
          /
          sum(rate(http_requests_total[2m])) > 0.05
        for: 1m
        labels:
          severity: critical
          team: mlops
        annotations:
          summary: "High 5xx error rate on MLOps API"
          description: >
            5xx error rate is {{ $value | humanizePercentage }} over the last 2 minutes
            (threshold: 5%). Check API logs for exception details.

      - alert: ElevatedClientErrors
        expr: >
          sum(rate(http_requests_total{status_code=~"4.."}[2m]))
          /
          sum(rate(http_requests_total[2m])) > 0.20
        for: 3m
        labels:
          severity: warning
          team: mlops
        annotations:
          summary: "High 4xx error rate — possible bad client requests"
          description: >
            4xx rate is {{ $value | humanizePercentage }} (threshold: 20%).
            Could indicate API misuse or schema changes.

      # ── Latence ──────────────────────────────────────────────────────────
      - alert: SlowPredictions
        expr: >
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{handler="/predict"}[5m])) by (le)
          ) > 0.5
        for: 2m
        labels:
          severity: warning
          team: mlops
        annotations:
          summary: "p99 prediction latency exceeds 500 ms"
          description: >
            p99 latency for /predict is {{ $value | humanizeDuration }}
            (threshold: 500 ms). Consider scaling the API or optimising the model.

      - alert: CriticalPredictionLatency
        expr: >
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{handler="/predict"}[5m])) by (le)
          ) > 2
        for: 1m
        labels:
          severity: critical
          team: mlops
        annotations:
          summary: "p95 prediction latency exceeds 2 s — service degraded"
          description: >
            p95 latency for /predict is {{ $value | humanizeDuration }}.
            Immediate investigation required.

      # ── Modèle ───────────────────────────────────────────────────────────
      - alert: ModelFallbackActive
        expr: mlops_model_registry_active == 0
        for: 1m
        labels:
          severity: warning
          team: mlops
        annotations:
          summary: "API is using the local fallback model (not MLFlow Registry)"
          description: >
            The API could not load the champion model from MLFlow Registry and
            fell back to the local .pkl file. Registry may be down or the
            'champion' alias is not set.

      # ── Volume ───────────────────────────────────────────────────────────
      - alert: UnexpectedTrafficSpike
        expr: sum(rate(http_requests_total{handler="/predict"}[1m])) > 100
        for: 2m
        labels:
          severity: warning
          team: mlops
        annotations:
          summary: "Unusual prediction request volume (> 100 req/s)"
          description: >
            Current rate: {{ $value | humanize }} req/s on /predict.
            Could indicate a load test, abuse, or an upstream loop.
